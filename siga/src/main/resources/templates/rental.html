<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/layout :: head('SIGA Equipos')}"></div>
    <link rel="stylesheet" href="/css/equipment.css">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('rental')}"></div>

<!-- CONTENIDO -->
<div class="content">

    <div class="header">

        <div>
            <h1>Alquileres</h1>
            <span>Gestión de alquileres de equipos</span>
        </div>

        <div class="profile-top">
            <i class="fa-regular fa-bell"></i>

            <nav>
                <button type="button" class="btn-add" onclick="abrirModal()">
                    <i class="fas fa-plus"></i>
                    Añadir Alquiler
                </button>
            </nav>
        </div>

    </div>

    <!-- MODAL -->
    <div id="modalRental" class="modal">

        <div class="modal-content">

            <span class="close" onclick="cerrarModal()">&times;</span>

            <h2>Registrar Equipo</h2>

            <form id="formRental"
                  action="/rental/save"
                  method="post">

                <select name="equipment.id" required>

                    <option value="">
                        Seleccione un equipo
                    </option>

                    <option th:each="equipment : ${equipments}"
                            th:value="${equipment.id}"
                            th:text="${equipment.code + ' - ' + equipment.brand}">
                    </option>

                </select>

                <select name="operator.id" required>

                    <option value="">
                        Seleccione un operador
                    </option>

                    <option th:each="operator : ${operators}"
                            th:value="${operator.id}"
                            th:text="${operator.username}">
                    </option>

                </select>

                <input type="text"
                       name="customerName"
                       placeholder="Nombre del Cliente"
                       required>

                <input type="text"
                       name="customerRuc"
                       placeholder="RUC / DNI"
                       required>

                <input type="number"
                       step="0.01"
                       name="hourlyRate"
                       placeholder="Tarifa por Hora"
                       required>

                <input type="number"
                       step="0.01"
                       name="totalAmount"
                       placeholder="Monto Total">

                <input type="text"
                       name="observaciones"
                       placeholder="Observaciones">

                <button type="submit">
                    Guardar Alquiler
                </button>

            </form>

        </div>

    </div>

    <!-- TABLA DE EQUIPOS -->
    <div class="table-container">

        <table class="tabla-equipos">

            <thead>
            <tr>
                <th>ID</th>
                <th>Equipo</th>
                <th>Cliente</th>
                <th>RUC / DNI</th>
                <th>Operador</th>
                <th>Fecha</th>
                <th>Tarifa Hora</th>
                <th>Monto Total</th>
                <th>Estado</th>
                <th>Observaciones</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="rental : ${rentals}">

                <td th:text="${rental.id}"></td>

                <td th:text="${rental.equipment != null ? rental.equipment.code : 'Sin equipo'}"></td>

                <td th:text="${rental.customerName}"></td>

                <td th:text="${rental.customerRuc}"></td>

                <td th:text="${rental.operator.username}"></td>

                <td th:text="${rental.date}"></td>

                <td th:text="${rental.hourlyRate}"></td>

                <td th:text="${rental.totalAmount}"></td>

                <td th:text="${rental.status}"></td>

                <td th:text="${rental.observaciones}"></td>

                <td>

                    <form th:action="@{/rental/close/{id}(id=${rental.id})}"
                          method="post"
                          style="display:inline;">

                        <button class="btn-edit"
                                th:if="${rental.status == 'ACTIVO'}">
                            Finalizar
                        </button>

                    </form>

                    <button class="btn-delete"
                            th:onclick="'eliminarRental(' + ${rental.id} + ')'">
                        <i class="fas fa-trash"></i>
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>
<script src="/js/rental.js"></script>
</body>
</html>
