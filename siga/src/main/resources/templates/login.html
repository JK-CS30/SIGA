<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Iniciar Sesión</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<!-- Panel informativo -->
<div class="hero">
    <img src="../img/logo_siga.png" alt="SIGA">

    <h1>Sistema Inteligente de Gestión de Activos</h1>

    <p>
        Gestión centralizada de vehículos, maquinaria,
        equipos industriales y activos empresariales.
    </p>
</div>

<!-- Login -->
<div class="login-container">

    <div class="login-header">
        <h2>Iniciar sesión</h2>
        <p>Acceda con sus credenciales</p>
    </div>

    <form method="post" action="/login">

        <div class="input-group">
            <label for="correo">Correo Electronico</label>
            <input
                    id="correo"
                    type="email"
                    name="username"
                    placeholder="example@greenliftmaquinarias.com"
                    required>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required>
        </div>

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Recordarme</label>
        </div>

        <button type="submit">
            INGRESAR
        </button>

        <a href="#" class="forgot-password">

        </a>

    </form>

    <div class="footer">
        © 2026 SIGA - Sistema Inteligente de Gestión de Activos
    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
