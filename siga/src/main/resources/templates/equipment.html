<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/layout :: head('SIGA Equipos')}"></div>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/equipment.css">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('equipment')}"></div>

<div class="content">
    <div class="header">
        <div>
            <h1>Equipos</h1>
            <span>Gestión de todos los equipos</span>
        </div>
        <div th:replace="~{fragments/layout :: header}"></div>
    </div>

    <div>
        <button type="button" class="btn-add" onclick="abrirModal()">
            <i class="fas fa-plus"></i> Añadir Equipo
        </button>
    </div>

    <div id="modalEquipo" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitle">Registrar Equipo</h2>
            
            <form id="formEquipment" action="/equipment/save" method="post" enctype="multipart/form-data">
                <input type="hidden" id="equipmentId" name="id">
                
                <label for="code">Código del Equipo:</label>
                <input id="code" type="text" name="code" th:value="${nextCode}" readonly>
                
                <input id="brand" type="text" name="brand" placeholder="Marca" required>
                <input id="serialNumber" type="text" name="serialNumber" placeholder="N° Serie" required>
                <input id="year" type="number" name="year" placeholder="Año" required>
                <input type="hidden" name="status" value="DISPONIBLE" />

                <label for="usageIndicator">Indicador de Uso Actual:</label>
                <input id="usageIndicator" type="number" step="0.1" name="usageIndicator" placeholder="Kilometraje o Horas totales" required>
                
                <label for="fileImagen">Imagen del Equipo:</label>
                <input id="fileImagen" type="file" name="fileImagen" accept="image/*">
                
                <button type="submit" id="btnGuardar">Guardar Equipo</button>
            </form>
        </div>
    </div>

    <div class="table-container">
        <table class="tabla-equipos">
            <thead>
                <tr>
                    <!--
                    <th>Imagen</th>  -->
                    <th>Código</th>
                    <th>Marca</th>
                    <th>N° Serie</th>
                    <th>Año</th>
                    <th>Horómetro / Kilometraje</th>
                    <th>Estado Actual</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                
                <tr th:each="equipment : ${equitment}">
                    <!--
                    <td>
                        <div th:if="${equipment.imagen != null}">
                            <img th:src="'data:image/png;base64,' + ${equipment.imagen}" alt="Equipo" width="50" height="50"/>
                        </div>
                        <div th:unless="${equipment.imagen != null}">
                            <i class="fas fa-laptop" style="font-size: 24px; color: #ccc;"></i>
                        </div>
                    </td>   -->
                    <td th:text="${equipment.code}"></td>
                    <td th:text="${equipment.brand}"></td>
                    <td th:text="${equipment.serialNumber}"></td>
                    <td th:text="${equipment.year}"></td>
                    <td th:text="${equipment.usageIndicator}"></td>
                    <td>
                        <span th:text="${equipment.status}" 
                            th:style="${equipment.status == 'ALQUILADO' ? 'color:#dc3545; font-weight:bold;' : (equipment.status == 'MANTENIMIENTO' ? 'color:#ffc107; font-weight:bold;' : 'color:#28a745; font-weight:bold;')}">
                        </span>
                    </td>
                    <td>
                        <button class="btn-edit"
                                th:data-id="${equipment.id}"
                                th:data-code="${equipment.code}"
                                th:data-brand="${equipment.brand}"
                                th:data-serial="${equipment.serialNumber}"
                                th:data-year="${equipment.year}"
                                th:data-usage="${equipment.usageIndicator}"
                                onclick="editarEquipo(this)">
                            <i class="fas fa-edit"></i>
                        </button>
                                                
                        <button class="btn-delete"
                                th:onclick="'eliminarEquipo(' + ${equipment.id} + ')'">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/js/equipment.js"></script>
</body>
</html>
