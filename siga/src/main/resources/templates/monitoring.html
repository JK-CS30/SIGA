<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SIGA Equipo</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/monitoring.css">
</head>
<body>


<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        <img src="../img/logo_siga.png" alt="SIGA">
    </div>

    <nav>
        <a href="/dashboard">
            <i class="fas fa-chart-line"></i>
            Dashboard
        </a>

        <a href="/equipment">
            <i class="fas fa-laptop"></i>
            Equipos
        </a>

        <a href="/rental">
            <i class="fas fa-file-signature"></i>
            Alquileres
        </a>

        <a href="/maintenance">
            <i class="fas fa-tools"></i>
            Mantenimiento
        </a>

        <a class="active" href="/monitoring">
            <i class="fas fa-satellite-dish"></i>
            Monitoreo
        </a>

        <a href="#">
            <i class="fas fa-chart-bar"></i>
            Reportes
        </a>
    <!--
        <a href="#">
            <i class="fas fa-gear"></i>
            Configuración
        </a>
        -->
    </nav>

    <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <div>
            <strong>Administrador</strong>
            <p th:text="${#authentication.name}"></p>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">
                <i class="fas fa-right-from-bracket"></i>
            </button>
        </form>

    </div>

</div>


<!-- CONTENIDO -->
<div class="content">

    <div class="header">
        <div>
            <h1>Monitoreo</h1>
            <span>Monitorización de equipos en tiempo real</span>
        </div>
    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <i class="fas fa-laptop"></i>
            <h3>Total de Equipos</h3>
            <span th:text="${equipments.size()}"></span>
        </div>

        <div class="card">
            <i class="fas fa-file-signature"></i>
            <h3>Alquileres Activos</h3>
            <span th:text="${rentals.size()}"></span>
        </div>

        <div class="card">
            <i class="fas fa-tools"></i>
            <h3>Registro de Mantenimiento</h3>
            <span th:text="${maintenances.size()}"></span>
        </div>

    </div>

    <!-- DOS PANELES -->
    <div class="monitor-grid">

        <!-- ALERTAS -->
        <div class="panel">
            <h2>Alerta Mantenimientos</h2>

            <table class="tabla-equipos">
                <thead>
                <tr>
                    <th>Equipo</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="m : ${maintenances}"
                    th:if="${m.status != null and #strings.toUpperCase(#strings.trim(m.status)) == 'ABIERTO'}">

                    <!-- EQUIPO -->
                    <td th:text="${m.equipment.code}"></td>

                    <!-- ESTADO -->
                    <td>
                        <span class="badge bg-success" th:text="${m.status}"></span>
                    </td>

                </tr>
                </tbody>
            </table>

        </div>

        <!-- ALQUILERES -->
        <div class="panel">
            <h2>Registro de Alquileres</h2>

            <table class="tabla-equipos">
                <thead>
                <tr>
                    <th>Equipo</th>
                    <th>Cliente</th>
                    <th>Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="r : ${rentals}"
                    th:if="${r.status != null and r.status.toUpperCase() == 'ACTIVO'}">

                    <td th:text="${r.equipment.code}"></td>
                    <td th:text="${r.customerName}"></td>

                    <td>
                        <span class="badge bg-primary" th:text="${r.status}"></span>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>

    </div>

</div>
</body>
</html>
