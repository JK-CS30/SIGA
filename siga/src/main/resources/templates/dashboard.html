<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/layout :: head('SIGA Dashboard')}"></div>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

<div class="content">
    <div class="header">
        <div>
            <h1>Dashboard</h1>
            <span>Resumen general del sistema</span>
        </div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Equipos</h3>
            <span th:text="${totalEquipments}"></span>
        </div>
        <div class="card">
            <h3>Equipos en Uso</h3>
            <span th:text="${activeRentals}"></span>
        </div>
        <div class="card">
            <h3>Mantenimiento Pendiente</h3>
            <span th:text="${openMaintenances}"></span>
        </div>
        <div class="card">
            <h3>Alquileres Activos</h3>
            <span th:text="${activeRentals}"></span>
        </div>
    </div>

    <div class="middle">
        <div class="panel">
            <h2>Estado de Equipos</h2>
            <div class="chart-placeholder">
                <i class="fas fa-chart-pie"></i>
            </div>
        </div>
        <div class="panel">
            <h2>Próximos Mantenimientos</h2>
            <ul>
                <li>Montacarga TOYOTA GM-0003</li>
                <li>Grupo Electrógeno GE-0001</li>
                <li>Camioneta GC-0010</li>
            </ul>
        </div>
    </div>

    <div class="panel activity">
        <h2>Actividad Reciente</h2>
        <table>
            <tr th:each="m : ${maintenances}">
                <td th:text="${m.equipment.code}"></td>
                <td th:text="${m.type}"></td>
                <td th:text="${m.entryDate}"></td>
            </tr>
        </table>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
