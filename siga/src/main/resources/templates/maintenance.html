<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/layout :: head('SIGA Equipos')}"></div>
    <link rel="stylesheet" href="/css/equipment.css">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('maintenance')}"></div>

<!-- CONTENIDO -->
<div class="content">

    <div class="header">

        <div>
            <h1>Mantenimientos</h1>
            <span>Gestión de mantenimiento</span>
        </div>

        <div class="profile-top">
            <i class="fa-regular fa-bell"></i>

            <nav>
                <button type="button" class="btn-add" onclick="abrirModal()">
                    <i class="fas fa-plus"></i>
                    Añadir Mantenimiento
                </button>
            </nav>
        </div>

    </div>

    <!-- MODAL -->
    <div id="modalMaintenace" class="modal">

        <div class="modal-content">

            <span class="close" onclick="cerrarModal()">&times;</span>

            <h2>Registrar Equipo</h2>

            <form id="formMaintenance"
                  action="/maintenance/save"
                  method="post">

                <select name="equipment.id" required>

                    <option value="">
                        Seleccione un equipo
                    </option>

                    <option th:each="equipo : ${equipments}"
                            th:value="${equipo.id}"
                            th:text="${equipo.code + ' - ' + equipo.brand}">
                    </option>

                </select>

                <select name="type" required>
                    <option value="">Tipo de mantenimiento</option>
                    <option value="PREVENTIVO">Preventivo</option>
                    <option value="CORRECTIVO">Correctivo</option>
                </select>

                <input type="text"
                       name="description"
                       placeholder="Descripción"
                       required>

                <input type="text"
                       name="hourMeter"
                       placeholder="Horómetro">

                <input type="number"
                       step="0.01"
                       name="cost"
                       placeholder="Costo"
                       required>

                <input type="text"
                       name="observations"
                       placeholder="Observaciones"
                       required>

                <button type="submit">
                    Guardar Mantenimiento
                </button>

            </form>

        </div>

    </div>

    <!-- TABLA DE EQUIPOS -->
    <div class="table-container">

        <table class="tabla-equipos">

            <thead>
            <tr>
                <th>Código</th>
                <th>Equipo</th>
                <th>Fecha de Ingreso</th>
                <th>Fecha de Salida</th>
                <th>Estado</th>
                <th>Tipo</th>
                <th>Descripción</th>
                <th>Horometro</th>
                <th>Costo</th>
                <th>Observaciones</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="maintenance : ${maintenances}">

                <td th:text="${maintenance.id}"></td>

                <td th:text="${maintenance.equipment.code}"></td>

                <td th:text="${maintenance.entryDate}"></td>

                <td th:text="${maintenance.exitDate}"></td>

                <td th:text="${maintenance.status}"></td>

                <td th:text="${maintenance.type}"></td>

                <td th:text="${maintenance.description}"></td>

                <td th:text="${maintenance.hourMeter}"></td>

                <td th:text="${maintenance.cost}"></td>

                <td th:text="${maintenance.observations}"></td>

                <td>

                    <form th:action="@{/maintenance/close/{id}(id=${maintenance.id})}"
                          method="post"
                          style="display:inline;">

                        <button class="btn-edit"
                                th:if="${maintenance.status == 'ABIERTO'}">
                            Cerrar
                        </button>

                    </form>

                    <button class="btn-delete"
                            th:onclick="'eliminarMantenimiento(' + ${maintenance.id} + ')'">
                        <i class="fas fa-trash"></i>
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>
<script src="/js/maintenance.js"></script>
</body>
</html>
